<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容管理 · AI Infra Notes</title>
    <script src="https://unpkg.com/decap-cms@3.16.3/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      if (window.CMS) {
        // 自动加载同目录下的 config.yml
        CMS.init();
      } else {
        document.body.innerHTML =
          '<div style="font-family:sans-serif;max-width:560px;margin:80px auto;padding:0 20px;line-height:1.8">' +
          '<h2>后台脚本加载失败</h2>' +
          '<p>可能是网络原因导致脚本（unpkg.com）没有加载成功。</p>' +
          '<p>请先 <a href="javascript:location.reload()">刷新重试</a>；' +
          '如果反复出现，请检查网络能否访问 unpkg.com，或使用代理后重试。</p></div>';
      }
    </script>
  </body>
</html>
