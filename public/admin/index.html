<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>内容管理 · AI Infra Notes</title>
  </head>
  <body>
    <div id="loading" style="font-family:sans-serif;max-width:560px;margin:80px auto;padding:0 20px;color:#666">
      正在加载编辑器，请稍候…
    </div>
    <script>
      // Sveltia CMS（Decap 的活跃维护替代品），依次尝试多个加载源：
      // jsDelivr → unpkg → 站内本地文件；加载成功后自动读取同目录 config.yml 初始化
      var sources = [
        "https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js",
        "https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js",
        "./sveltia-cms.js"
      ];

      function showFail() {
        document.body.innerHTML =
          '<div style="font-family:sans-serif;max-width:560px;margin:80px auto;padding:0 20px;line-height:1.8">' +
          '<h2>后台脚本加载失败</h2>' +
          '<p>三个加载源（jsDelivr、unpkg、站内本地文件）都未能加载成功。</p>' +
          '<p>请检查网络后 <a href="javascript:location.reload()">刷新重试</a>，或使用代理访问。</p></div>';
      }

      function tryLoad(i) {
        if (i >= sources.length) { showFail(); return; }
        var s = document.createElement("script");
        s.src = sources[i];
        var settled = false;
        s.onload = function () {
          if (settled) return;
          settled = true;
          var el = document.getElementById("loading");
          if (el) el.remove();
          // Sveltia CMS 脚本加载后会自动初始化
        };
        s.onerror = function () {
          if (settled) return;
          settled = true;
          tryLoad(i + 1);
        };
        document.head.appendChild(s);
      }

      tryLoad(0);
    </script>
  </body>
</html>
